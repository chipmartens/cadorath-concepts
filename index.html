<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cadorath homepage concepts</title>
<style>
  :root {
    --bg: #0b0c0e;
    --dock: rgba(18, 19, 22, 0.78);
    --line: rgba(255, 255, 255, 0.14);
    --text: #f2f2f0;
    --muted: #a3a7ae;
    --gap: 14px;
    --radius: 22px;
    --below: 72px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* the live homepage, full width, scrolling inside a rounded box */
  .frame {
    position: fixed; inset: var(--gap) var(--gap) var(--below) var(--gap);
    border-radius: var(--radius); overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px var(--line);
  }
  .frame iframe { display: block; width: 100%; height: 100%; border: 0; }

  /* the concept selector floats over the bottom of the box */
  .dock {
    position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom));
    width: max-content; max-width: calc(100% - 2 * var(--gap));
    display: flex; align-items: center; gap: 18px;
    padding: 6px 16px 6px 6px;
    background: var(--dock); border: 1px solid var(--line); border-radius: 18px;
    -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  .dock ol { list-style: none; padding: 0; display: flex; gap: 4px; }
  .dock ol button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; gap: 10px; align-items: center; white-space: nowrap;
    padding: 5px 12px 5px 5px; border-radius: 12px; border: 1px solid transparent;
    transition: background-color .2s ease, border-color .2s ease;
  }
  .dock ol button:hover { background: rgba(255, 255, 255, 0.06); }
  .dock ol button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .dock ol button[aria-current="true"] { background: rgba(255, 255, 255, 0.1); border-color: var(--line); }
  .dock ol img { width: 64px; height: 40px; object-fit: cover; border-radius: 8px; display: block; opacity: .6; transition: opacity .2s ease; }
  .dock ol button[aria-current="true"] img, .dock ol button:hover img { opacity: 1; }
  .dock .num { display: block; font-size: 11px; color: var(--muted); }
  .dock .name { display: block; font-size: 14px; font-weight: 600; }
  .dock .idea { display: none; }


  .aside { display: flex; align-items: center; gap: 16px; }
  .fs {
    all: unset; box-sizing: border-box; cursor: pointer; height: 52px; padding: 0 16px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--text);
    border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 255, 255, 0.06);
    transition: background-color .2s ease, border-color .2s ease;
  }
  .fs:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.28); }
  .fs:focus-visible, .back:focus-visible, .credit a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .credit { padding-left: 16px; border-left: 1px solid var(--line); }
  .by { display: flex; align-items: center; gap: 7px; white-space: nowrap; font-size: 13px; color: var(--text); }
  .by .dim { color: var(--muted); }
  .by img { display: block; height: 13px; width: auto; margin-top: 1px; }
  .credit a { display: inline-block; margin-top: 3px; font-size: 11.5px; color: var(--muted); text-decoration: none; transition: color .2s ease; }
  .credit a:hover { color: var(--text); }

  @media (max-width: 960px) {
    :root { --gap: 8px; --radius: 16px; --below: 104px; }
    .dock { flex-direction: column; align-items: stretch; gap: 4px; padding: 6px; width: calc(100% - 2 * var(--gap)); bottom: calc(8px + env(safe-area-inset-bottom)); }
    .aside { justify-content: space-between; gap: 8px; padding: 0 2px 2px; }
    .fs { height: 36px; padding: 0 12px; font-size: 12px; }
    .credit { padding: 0; border: 0; order: -1; }
    .by { font-size: 11.5px; gap: 6px; }
    .by img { height: 11px; }
    .credit a { margin-top: 1px; font-size: 11px; }
    .dock ol { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .dock ol button { padding: 4px 6px 4px 4px; gap: 6px; }
    .dock ol img { width: 40px; height: 28px; }
    .dock .num { display: none; }
    .dock .name { font-size: 12px; white-space: normal; line-height: 1.2; }
  }

  /* full screen: the box fills the window, the dock hides, one small button brings it back */
  .frame, .dock { transition: inset .3s ease, border-radius .3s ease, opacity .25s ease, transform .3s ease; }
  body.is-full .frame { inset: 0; border-radius: 0; box-shadow: none; }
  body.is-full .dock { opacity: 0; pointer-events: none; transform: translate(-50%, 16px); }
  .back {
    all: unset; box-sizing: border-box; cursor: pointer; position: fixed; z-index: 11;
    right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    padding: 10px 16px; border-radius: 999px; font: 600 13px/1 var(--font); color: var(--text);
    background: var(--dock); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    display: none; align-items: center; gap: 8px;
  }
  body.is-full .back { display: inline-flex; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="frame"><iframe id="view" src="concept-1/" title="Cadorath homepage concept"></iframe></div>

<button type="button" class="back" id="back"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Exit full screen</span></button>

<nav class="dock" aria-label="Choose a concept">
  <ol>
    <li><button type="button" data-target="concept-1" aria-current="true">
      <img src="img/concept-1-thumb.jpg" alt="">
      <span><span class="num">Concept 1</span><span class="name">The part</span><span class="idea">One real part, from worn to back in service.</span></span>
    </button></li>
    <li><button type="button" data-target="concept-2" aria-current="false">
      <img src="img/concept-2-thumb.jpg" alt="">
      <span><span class="num">Concept 2</span><span class="name">Back in service</span><span class="idea">The aircraft at work, never the part.</span></span>
    </button></li>
    <li><button type="button" data-target="concept-3" aria-current="false">
      <img src="img/concept-3-thumb.jpg" alt="">
      <span><span class="num">Concept 3</span><span class="name">Finish</span><span class="idea">One line, then the colours of real finishes.</span></span>
    </button></li>
  </ol>
  <div class="aside">
    <button type="button" class="fs" id="full">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Full screen</span>
    </button>
    <div class="credit">
      <p class="by"><span class="dim">Built by</span><img src="img/mode40-logo-white.svg" width="68" height="14" alt="mode40"><span>Strategy &amp; Creative</span></p>
      <a href="credits.html" id="credits">Image credits</a>
    </div>
  </div>
</nav>

<script>
  const view = document.getElementById('view');
  const full = document.getElementById('full');
  const back = document.getElementById('back');
  const dock = document.querySelector('.dock');
  const buttons = [...document.querySelectorAll('.dock ol button')];
  const ids = buttons.map(b => b.dataset.target);

  function show(id, push) {
    if (!ids.includes(id)) id = ids[0];
    const src = id + '/';
    if (!view.src.endsWith(src)) view.src = src;
    buttons.forEach(b => b.setAttribute('aria-current', String(b.dataset.target === id)));
    document.getElementById('credits').href = 'credits.html#' + id;
    if (push) history.replaceState(null, '', '#' + id);
  }

  // add room under each mockup's footer so the dock never covers the end of the page
  view.addEventListener('load', () => {
    const doc = view.contentDocument;
    if (!doc || !doc.body) return;
    const last = [...doc.body.children].reverse().find(el => !['SCRIPT', 'STYLE'].includes(el.tagName));
    const pad = doc.createElement('div');
    pad.setAttribute('aria-hidden', 'true');
    pad.style.height = '24px';
    pad.style.background = last ? getComputedStyle(last).backgroundColor : 'transparent';
    doc.body.appendChild(pad);
  });

  function setFull(on) {
    document.body.classList.toggle('is-full', on);
    (on ? back : full).focus();
  }
  full.addEventListener('click', () => setFull(true));
  back.addEventListener('click', () => setFull(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setFull(false); });

  buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.target, true)));
  show(location.hash.slice(1), false);
</script>
</body>
</html>
